---
# Versión del agente. Debe ser menor o igual que la del manager (4.14.x).
# Déjala vacía ("") para instalar la última disponible en el repositorio 4.x.
lab_wazuh_agent_version: "4.14.9"

# Dónde está el SIEM dentro del rango (VLAN y último octeto del range-config).
# La IP completa se calcula como 10.<N>.<vlan>.<octeto>, donde 10.<N> sale de
# ludus_dns_server (siempre es la .254 de la VLAN de la VM).
lab_siem_vlan: 20
lab_siem_octet: 10

# Para forzar la IP del SIEM a mano (p. ej. si algo falla): lab_siem_ip: "10.2.20.10"
lab_siem_ip: ""

# Opcional, por VM (se pasan con role_vars en el range-config):
#   lab_wazuh_localfiles: [{ location: /var/log/nginx/access.log, format: apache }]
#   lab_wazuh_fim_dirs: ["/var/www", "/etc/nginx"]
lab_wazuh_localfiles: []
lab_wazuh_fim_dirs: []
