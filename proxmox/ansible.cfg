# Ansible del itinerario «servicios» desplegado en Proxmox VE sin Ludus.
# Ejecuta los playbooks desde esta carpeta (ver docs/08-proxmox-nativo.md).
[defaults]
inventory = inventario.yml
roles_path = ../rango/ansible/roles
# Las VM del laboratorio se recrean y cambian de clave SSH: no se guardan en known_hosts.
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
